[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lmmock"
version = "0.1.0"
description = "A visual mock server for LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LMMock contributors"}]
keywords = ["llm", "mock-server", "openai", "anthropic", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
lmmock = "lmmock.cli:main"

[project.urls]
Homepage = "https://github.com/lewismosciski/LMMOCK"
Issues = "https://github.com/lewismosciski/LMMOCK/issues"
Releases = "https://github.com/lewismosciski/LMMOCK/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lmmock = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
