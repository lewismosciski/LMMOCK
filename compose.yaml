services:
  lmmock:
    image: lmmock:local
    build: .
    ports:
      - "127.0.0.1:17321:17321"
    environment:
      LMMOCK_HOST: 0.0.0.0
      LMMOCK_PORT: 17321
      LMMOCK_DATA_DIR: /data
      LMMOCK_NO_BROWSER: "1"
    volumes:
      - lmmock-data:/data
    init: true

volumes:
  lmmock-data:
